name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-gtk4 ffmpeg \
            xvfb dbus-x11 desktop-file-utils dpkg-dev

      - name: Compile Python modules
        run: python3 -m compileall -q .

      - name: Run non-GUI test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run GTK GUI test suite
        env:
          CINEPRIME_GUI_TESTS: "1"
          GDK_BACKEND: x11
        run: xvfb-run -a dbus-run-session -- python3 -m unittest discover -s tests -p 'test_gui.py' -v

      - name: Run real GStreamer bus-error integration test
        env:
          CINEPRIME_GST_INTEGRATION: "1"
          GDK_BACKEND: x11
        run: xvfb-run -a dbus-run-session -- python3 -m unittest discover -s tests -p 'test_gstreamer_integration.py' -v

      - name: Validate desktop entry
        run: desktop-file-validate data/io.github.helder.cineprime.desktop

      - name: Build Debian package
        run: ./packaging/build-deb.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: cineprime-deb
          path: dist/cineprime_*_all.deb
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged release
    needs: test-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download Debian package artifact
        uses: actions/download-artifact@v4
        with:
          name: cineprime-deb
          path: release-assets

      - name: Generate SHA-256 checksum
        run: cd release-assets && sha256sum cineprime_*_all.deb > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cine Prime ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            release-assets/cineprime_*_all.deb
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true